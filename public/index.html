<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELQERIX PROXY</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:55px auto;padding:20px}.hero{padding:22px;border-radius:30px;background:linear-gradient(110deg,#063d61,#251b64,#341052);border:1px solid #ffffff1c}.brand{display:flex;gap:15px;align-items:center}.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#14c9ff,#6062ee);font-weight:900;font-size:18px}h1{font-size:25px;margin:0}.sub{margin:5px 0 0;color:#aaaac0;font-size:14px}.pills{margin-top:14px;display:flex;gap:8px}.pill{padding:6px 13px;border-radius:20px;background:transparent;font-weight:700;font-size:12px}.buy{border:1px solid #009ac4;color:#00d5ff}.act{border:1px solid #149c55;color:#19d76c}.card{background:#080d1c;border:1px solid #252a38;border-radius:25px;padding:20px 17px 17px;margin-top:15px}.label{color:#999eaf;font-size:12px;font-weight:700;letter-spacing:2px;margin:0 2px 10px}.input{width:100%;height:57px;border-radius:18px;border:1px solid #343a49;background:transparent;color:#ddd;text-align:center;font-size:19px;outline:0}.btn{width:100%;height:62px;border:0;border-radius:20px;margin-top:18px;background:linear-gradient(90deg,#1bc85a,#12d8c2,#06d8f4);color:#050505;font-size:16px;font-weight:900;cursor:pointer}.free{margin-top:15px}.status{margin-top:15px;padding:13px;border-radius:15px;background:#101522;border:1px solid #242c3e;color:#bfc5d5;text-align:center;font-size:14px}.hidden{display:none}.unlocked{margin-top:15px;padding:18px;border-radius:20px;background:#081a12;border:1px solid #15945b}.unlocked b{color:#18e879}@media(max-width:480px){.wrap{margin-top:30px;padding:16px}h1{font-size:23px}}</style></head><body><div class="wrap"><div class="hero"><div class="brand"><div class="logo">VQ</div><div><h1>VELQERIX PROXY</h1><p class="sub">Se requiere una licencia para usar el proxy</p></div></div><div class="pills"><button class="pill buy" onclick="focusLicense()">COMPRAR</button><button class="pill act" onclick="focusLicense()">ACTIVAR</button></div></div><div class="card"><div class="label">CLAVE DE LICENCIA (VQ-XXXXXX)</div><input id="license" class="input" placeholder="VQ-XXXXXX" autocomplete="off"><button class="btn" onclick="activate()">ACTIVAR LICENCIA</button></div><button class="btn free" onclick="getKey()">🎁 PEGAR KEY GRÁTIS (3h)</button><div id="unlocked" class="unlocked hidden"><b>✓ ACESSO LIBERADO</b><div id="expiry"></div></div><div id="status" class="status hidden"></div></div><script>const $=id=>document.getElementById(id);function msg(t){$('status').textContent=t;$('status').classList.remove('hidden')}function focusLicense(){$('license').focus()}function getKey(){msg('🔄 Preparando sua KEY...');location.href='/api/start'}async function activate(){const key=$('license').value.trim().toUpperCase();$('license').value=key;if(!/^VQ-[A-Z0-9]{6}$/.test(key))return msg('❌ Use o formato VQ-XXXXXX.');try{const r=await fetch('/api/license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const d=await r.json();msg(d.message||'Licença processada.');if(d.ok){$('unlocked').classList.remove('hidden');$('expiry').textContent='Chave válida até '+new Date(d.expiresAt).toLocaleString('pt-BR')+' • 3h';localStorage.setItem('vq_key',key)}}catch(e){msg('⚠️ Backend não disponível.')}}const saved=localStorage.getItem('vq_key');if(saved)$('license').value=saved;</script></body></html>
